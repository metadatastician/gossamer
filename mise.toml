[tools]
# Project toolchains. Cargo is supplied by Rust; Bun is the estate JavaScript
# runtime and task runner.
just = "latest"
shellcheck = "latest"
bun = "latest"
rust = "latest"
zig = "0.15.2"

[env]
# Common environment variables
NODE_ENV = "development"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"

[tasks.build]
run = "cargo build --release"

[tasks.test]
run = "cargo test"

[tasks.bun-binding]
dir = "bindings/affinescript"
run = "bun run build"
