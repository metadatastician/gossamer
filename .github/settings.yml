#
# Repository settings for probot/settings GitHub App.
# https://github.com/probot/settings
#
# This file defines repository-level configuration that is automatically
# applied by the probot/settings app when changes are pushed to the default
# branch. Install the app at: https://github.com/apps/settings
#
# Repository settings — configured for metadatastician/gossamer.

# ─── Repository Settings ───────────────────────────────────────────────────────

repository:
  name: "gossamer"
  description: "A resource-aware desktop shell for web front ends, aiming to make webview handles and permissions statically checkable; Tauri/Electron-style packaging with optional Burble and PanLL integration."
  homepage: ""
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# ─── Labels ────────────────────────────────────────────────────────────────────

labels:
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"

  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"

  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"

  - name: "security"
    color: "e4e669"
    description: "Security-related issue or vulnerability"

  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"

  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"

  - name: "question"
    color: "d876e3"
    description: "Further information is requested"

  - name: "duplicate"
    color: "cfd3d7"
    description: "This issue or pull request already exists"

  - name: "invalid"
    color: "e4e669"
    description: "This doesn't seem right"

  - name: "wontfix"
    color: "ffffff"
    description: "This will not be worked on"

  - name: "dependencies"
    color: "0366d6"
    description: "Pull requests that update a dependency file"

  - name: "ci/cd"
    color: "fbca04"
    description: "Continuous integration and deployment"

  - name: "rsr"
    color: "006b75"
    description: "Rhodium Standard Repository compliance"

  - name: "hypatia"
    color: "5319e7"
    description: "Hypatia neurosymbolic scanner finding"

  - name: "bot"
    color: "b4a8d1"
    description: "Automated action by gitbot-fleet"

  - name: "breaking-change"
    color: "b60205"
    description: "Introduces a breaking change"

  - name: "performance"
    color: "f9d0c4"
    description: "Performance improvement"

  - name: "refactor"
    color: "c5def5"
    description: "Code refactoring with no functional change"

  - name: "proof needed"
    color: "fbcca0"
    description: "Formal proof required for verification"

  - name: "proof complete"
    color: "006b75"
    description: "Formal proof has been completed and verified"

# ─── Branch Protection ─────────────────────────────────────────────────────────
#
# Branch protection is governed by the live GitHub rulesets, not by probot/settings.
# For metadatastician/gossamer the active default-branch rules come from the
# organization rulesets EstateBranching (#18225024), Branch-Floor (#23868655),
# and Branch-Signatures (#24634124), together with the other applicable active
# rulesets returned by the repository rules API. No repository-owned ruleset is
# currently returned by GET /repos/metadatastician/gossamer/rulesets?includes_parents=false.
# Those live rulesets are authoritative; do not duplicate stale branches: protection here.
