# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # The reusable declares no workflow_call secrets and references no
    # secrets.* context. Its gitleaks, rust-secrets, and shell-secrets jobs
    # each require only contents: read. A job-level permissions block replaces
    # the workflow-level grant, so keep this least-privilege grant explicit.
    # Do not pass secrets: inherit to this reusable.
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b5a8c536780e3a250e71dfe99ecdf18582638965
