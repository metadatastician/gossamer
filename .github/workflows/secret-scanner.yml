# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    # The reusable's gitleaks job elevates to pull-requests: write (PR
    # summary comment) and actions: read; a called workflow cannot exceed
    # the caller's grant, so they must be granted here or the run dies at
    # startup ("workflow file issue").
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@fcb566cfb8a86cea2d3666bf65a4f177a49b1313
    secrets: inherit
