#
# Gossamer — Comprehensive CI/CD Pipeline
#
# This workflow runs on every push and pull request to ensure:
# 1. Code compiles on all supported platforms
# 2. All tests pass
# 3. Formal proofs are valid
# 4. Static analysis passes
# 5. Code quality gates pass
#
# Triggered by:
# - Pushes to main/master/develop branches
# - Pull requests
# - Manual dispatch
# - Scheduled (daily)

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '*.adoc'
      - 'LICENSE'
      - '.github/**'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Stage 1: Code Quality Gates
  # ===========================================================================
  
  lint:
    name: Lint + Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Check Zig formatting
        run: zig fmt --check src/interface/ffi/build.zig cli/build.zig cli/launcher/build.zig

      - name: Check Rust binding formatting
        run: cargo fmt --manifest-path bindings/rust/Cargo.toml --all -- --check

  # ===========================================================================
  # Stage 3: Build & Test (Linux)
  # ===========================================================================
  
  build-linux:
    name: Build + Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install GTK/WebKit dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Build FFI library
        run: |
          cd src/interface/ffi
          zig build -Doptimize=ReleaseSafe

      - name: Build CLI
        run: |
          cd cli
          zig build -Doptimize=ReleaseSafe

      - name: Run integration tests
        run: |
          cd src/interface/ffi
          zig build test

  # ===========================================================================
  # Stage 4: Cross-Platform Builds
  # ===========================================================================
  
  build-macos:
    name: Build (macOS)
    # Zig 0.15.2 cannot link its build runner against the macOS 26 SDK.
    # macos-15 supplies the supported Xcode 16.4 SDK while the estate remains
    # on the exact 0.15.2 toolchain.
    runs-on: macos-15
    timeout-minutes: 30
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Build FFI library (macOS)
        run: |
          cd src/interface/ffi
          zig build -Dtarget=native -Doptimize=ReleaseSafe

      - name: Build CLI (macOS)
        run: |
          cd cli
          zig build -Dtarget=native -Doptimize=ReleaseSafe

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Build FFI library (Windows)
        run: |
          cd src/interface/ffi
          zig build -Dtarget=native -Doptimize=ReleaseSafe

      - name: Build CLI (Windows)
        run: |
          cd cli
          zig build -Dtarget=native -Doptimize=ReleaseSafe

  # ===========================================================================
  # Stage 5: Package Building
  # ===========================================================================
  
  package-linux:
    name: Package (Linux .deb/.rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install GTK/WebKit dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install packaging tools
        run: sudo apt-get install -y dpkg-dev rpm build-essential just xz-utils

      - name: Install integrity-pinned Wasmtime C API
        run: |
          archive="$RUNNER_TEMP/wasmtime-c-api.tar.xz"
          curl -fsSLo "$archive" \
            https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.1/wasmtime-v48.0.1-x86_64-linux-c-api.tar.xz
          echo '67683d04b416a8b91f0e607e7b4c22bd32f18f947c10b5372eb8c277ae3b883a  '"$archive" | sha256sum -c -
          sudo tar -xJf "$archive" --strip-components=1 -C /usr/local
          test -f /usr/local/include/wasmtime.h
          test -f /usr/local/lib/libwasmtime.a

      - name: Build pinned Ephapax compiler
        id: ephapax
        env:
          EPHAPAX_REF: 55d6a24cebf3e6fb4dc59212c4550e0df0544f52
        run: |
          src="$RUNNER_TEMP/ephapax"
          git init "$src"
          git -C "$src" remote add origin https://github.com/hyperpolymath/ephapax.git
          git -C "$src" fetch --depth 1 origin "$EPHAPAX_REF"
          git -C "$src" checkout --detach FETCH_HEAD
          cargo build --locked --release --manifest-path "$src/Cargo.toml" --bin ephapax
          "$src/target/release/ephapax" --version
          echo "bin=$src/target/release/ephapax" >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          EPHAPAX: ${{ steps.ephapax.outputs.bin }}
        run: |
          just package-deb
          just package-rpm

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-packages
          path: dist/linux/*
          if-no-files-found: error

  package-macos:
    name: Package (macOS .dmg)
    runs-on: macos-15
    timeout-minutes: 45
    needs: [build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install just
        run: brew install just

      - name: Build macOS package
        run: just package-macos

      - name: Upload package as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-package
          path: dist/macos/*.dmg
          if-no-files-found: error

  # ===========================================================================
  # Stage 6: Documentation
  # ===========================================================================
  
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install GTK/WebKit dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install just
        run: cargo install just --locked --version 1.58.0

      - name: Build site
        run: just build-site

      - name: Upload site as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation
          path: site/dist/

  # ===========================================================================
  # Stage 7: Release
  # ===========================================================================
  
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-linux, build-macos, build-windows, package-linux, package-macos, docs]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create release tag
        id: tag
        run: |
          # Get version from main.zig
          VERSION=$(grep '^const VERSION' src/interface/ffi/src/main.zig | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Creating release for v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          name: Gossamer v${{ steps.tag.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/linux-packages/*.deb
            artifacts/linux-packages/*.rpm
            artifacts/macos-package/*.dmg
          body: |
            ## Gossamer v${{ steps.tag.outputs.version }}
            
            A linearly-typed webview shell with provable resource safety.
            
            **Changes:**
            - See CHANGELOG.md for details
            
            **Assets:**
            - Debian package (.deb)
            - RPM package (.rpm)
            - macOS disk image (.dmg)
            
            **Verification:**
            All 192 integration tests passed.
            All 16 ABI proof modules type-check green.
