# SPDX-License-Identifier: MPL-2.0
# TEMPORARY diagnostic workflow (triage aid, removed before the final PR).
#
# The reusable Hypatia gates only publish the *derived* counts, and the raw
# findings JSON is written to a file that is not printed into the job log.
# This workflow mirrors the scanner setup from
# hyperpolymath/standards/.github/workflows/{governance,hypatia-scan}-reusable.yml
# and commits the raw findings plus two derived tables onto the branch so the
# triage can be done against exact data instead of guesses.
name: Hypatia Findings Snapshot

on:
  # workflow_dispatch cannot target a branch that does not carry the workflow
  # on the default branch, so the diagnostic is keyed to a sentinel file.
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/hypatia-snapshot-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    name: Snapshot Hypatia findings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Elixir for Hypatia scanner
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'

      - name: Resolve and build Hypatia scanner
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hyperpolymath/hypatia.git "$HOME/hypatia"
          cd "$HOME/hypatia"
          git rev-parse HEAD > "$HOME/hypatia-sha.txt"
          echo "hypatia HEAD: $(cat "$HOME/hypatia-sha.txt")"
          mix deps.get
          mix escript.build

      - name: Run Hypatia scan
        run: |
          # Mirrors the reusable workflow: --exit-zero, JSON to stdout.
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero \
            > /tmp/findings.json 2>/tmp/hypatia-scan.err || true
          echo "--- scanner stderr (tail) ---"
          tail -n 25 /tmp/hypatia-scan.err || true
          echo "--- slurp cardinality (the pinned gate requires length == 1) ---"
          jq -s 'length' /tmp/findings.json || true
          echo "--- bytes / sha256 ---"
          wc -c /tmp/findings.json
          sha256sum /tmp/findings.json || true

      - name: Derive tables
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .hypatia-snapshot
          cp "$HOME/hypatia-sha.txt" .hypatia-snapshot/scanner-sha.txt 2>/dev/null || true
          cp /tmp/hypatia-scan.err .hypatia-snapshot/scanner-stderr.txt 2>/dev/null || true
          if [ -s /tmp/findings.json ] && jq -e 'type == "array"' /tmp/findings.json >/dev/null 2>&1; then
            cp /tmp/findings.json .hypatia-snapshot/findings.json
            jq -r '.[] | [.severity, (.rule_module // ""), (.type // ""), (.file // ""),
                   ((.line // 0) | tostring), (.reason // .action // .message // "")] | @tsv' \
              /tmp/findings.json | sort > .hypatia-snapshot/findings.tsv
            jq -r 'group_by([.severity, (.rule_module // ""), (.type // ""), (.file // "")])
                   | map({n: length, k: (.[0] | [.severity, (.rule_module // ""), (.type // ""), (.file // "")] | join(" | "))})
                   | sort_by(-.n) | .[] | "\(.n)\t\(.k)"' \
              /tmp/findings.json > .hypatia-snapshot/groups.tsv
            jq -r '[.[] | .severity] | group_by(.) | map({s: .[0], n: length}) | sort_by(-.n)
                   | .[] | "\(.n)\t\(.s)"' /tmp/findings.json > .hypatia-snapshot/severities.tsv
          else
            echo "NOT-A-VALID-ARRAY" > .hypatia-snapshot/INVALID.txt
            cp /tmp/findings.json .hypatia-snapshot/findings.raw.txt 2>/dev/null || true
          fi
          ls -la .hypatia-snapshot/

      - name: Publish snapshot onto the branch
        if: always()
        run: |
          set -uo pipefail
          git config user.name "hypatia-snapshot"
          git config user.email "noreply@github.com"
          git add -f .hypatia-snapshot
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "chore(debug): snapshot Hypatia findings for gate triage"
            git push
          fi

      - name: Annotate group summary (fallback if the push failed)
        if: always()
        run: |
          set -uo pipefail
          if [ -f .hypatia-snapshot/groups.tsv ]; then
            head -n 40 .hypatia-snapshot/groups.tsv | while IFS=$'\t' read -r n k; do
              echo "::notice::${n}x ${k}"
            done
          fi
          if [ -f .hypatia-snapshot/severities.tsv ]; then
            echo "::warning::severity histogram: $(tr '\n' ' ' < .hypatia-snapshot/severities.tsv)"
          fi
