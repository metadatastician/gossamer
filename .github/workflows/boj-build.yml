name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Send a secure trigger to boj-server to build this repository
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" '{repo: $repo, branch: $branch, engine: "casket"}' |
            curl --fail-with-body --max-time 30 -X POST "http://boj-server.local:7700/cartridges/ssg-mcp/invoke" -H "Content-Type: application/json" --data-binary @-
        continue-on-error: true
permissions:
  actions: read
  contents: read
