# Gossamer — Quick Test Workflow
#
# Runs on every push and pull request to quickly verify:
# - Code compiles
# - Unit tests pass
# - Formal proofs are valid
#
# This is a fast feedback loop (5-10 minutes).
# For comprehensive testing, use ci-cd.yml.

name: Quick Tests

on:
  push:
    branches: [main, master, develop, feature/**]
    paths:
      - 'src/**'
      - 'bindings/rust/**'
      - 'cli/**'
      - 'tests/**'
      - 'Justfile'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'bindings/rust/**'
      - 'cli/**'
      - 'tests/**'
      - 'Justfile'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install GTK/WebKit dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Build FFI library
        run: |
          cd src/interface/ffi
          zig build

      - name: Build CLI
        run: |
          cd cli
          zig build

      - name: Run unit tests
        run: |
          cd src/interface/ffi
          zig build test

      - name: Build and test the Rust binding against native Gossamer
        env:
          GOSSAMER_ZIG: zig
        run: cargo test --manifest-path bindings/rust/Cargo.toml --all-targets --locked

  proofs:
    name: Formal Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Chez Scheme
        run: sudo apt-get update && sudo apt-get install -y chezscheme

      - name: Build and install Idris2 (pinned v0.8.0)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git "$RUNNER_TEMP/Idris2"
          cd "$RUNNER_TEMP/Idris2"
          make bootstrap SCHEME=chezscheme
          make install
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Type-check ABI proofs
        run: |
          cd src/interface/abi
          idris2 --typecheck gossamer-abi.ipkg
          idris2 --typecheck gossamer-groove.ipkg

  clippy:
    name: Clippy-Style Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Install GTK/WebKit dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run strict Rust lint checks against native Gossamer
        env:
          GOSSAMER_ZIG: zig
        run: cargo clippy --manifest-path bindings/rust/Cargo.toml --all-targets --locked -- -D warnings

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Check Zig formatting
        run: zig fmt --check src/interface/ffi/build.zig cli/build.zig cli/launcher/build.zig

      - name: Check Rust binding formatting
        run: cargo fmt --manifest-path bindings/rust/Cargo.toml --all -- --check
