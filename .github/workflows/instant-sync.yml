# This workflow is managed by gh actions-lock.
# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync
on:
  push:
    branches: [main, master]
  release:
    types: [published]
permissions:
  actions: read
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN != '' }}
    steps:
      # Presence gate: if the dispatch token is not configured, skip
      # cleanly instead of failing the run with an opaque 401.
      - name: Trigger Propagation
        if: env.HAS_DISPATCH_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }
      - name: Confirm
        if: env.HAS_DISPATCH_TOKEN == 'true'
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
