name: GitHub Pages (Ddraig SSG)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Site
        uses: actions/checkout@v7.0.1
      - name: Checkout Ddraig SSG
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/ddraig-ssg
          path: .ddraig-ssg
      - name: Compile Ddraig
        working-directory: .ddraig-ssg
        run: idris2 Ddraig.idr -o ddraig
      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp site/style.css _site/
          cp -r site/assets _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '_site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
