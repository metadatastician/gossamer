# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# dogfood-gate.yml — DEED + K9 Conformance Gates and K9 Verdict Grid
#
# Runs the canonical validators and verdict-grid renderer from
# hyperpolymath/standards@01c9b0c9f2646ebea0b30a9588462642ac94aee9:
#   - 1-formats/deed/tools/deed_lint.js (against 1-formats/deed/spec/abnf/deed.abnf v1.2.0)
#   - 1-formats/k9/tools/k9-validate.sh (against 1-formats/k9/spec/contract/k9_contract.ncl v1.0.0)
#   - scripts/k9-grid.sh (conformance family of docs/VERDICT-GRID-SPEC.adoc)
#
# Note: Executes via step-level checkout of hyperpolymath/standards rather than
# cross-owner workflow_call so runs succeed under metadatastician's repository
# Actions allowlist without startup_failure.
name: Dogfood Gate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: DEED conformance — canonical deed_lint.js (standards 1-formats/deed/)
  # ---------------------------------------------------------------------------
  deed-validate:
    name: Validate DEED manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check out canonical DEED validator from standards
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: 01c9b0c9f2646ebea0b30a9588462642ac94aee9
          path: .standards-deed
          persist-credentials: false
          sparse-checkout: |
            1-formats/deed/tools
            1-formats/deed/spec
          sparse-checkout-cone-mode: false

      - name: Self-test canonical DEED linter
        run: node .standards-deed/1-formats/deed/tools/deed_lint.js --self-test

      - name: Lint committed .deed files and enforce .a2ml retirement
        run: |
          set -euo pipefail
          cp .standards-deed/1-formats/deed/tools/deed_lint.js "$RUNNER_TEMP/deed_lint.js"
          LINTER="$RUNNER_TEMP/deed_lint.js"
          rm -rf .standards-deed

          a2ml_count=$(find . -type f -name '*.a2ml' -not -path './.git/*' | wc -l)
          if [ "$a2ml_count" -gt 0 ]; then
            echo "::error::Found $a2ml_count retired .a2ml file(s); migrate all .a2ml files to .deed (standards#837)"
            find . -type f -name '*.a2ml' -not -path './.git/*'
            exit 1
          fi

          mapfile -d '' files < <(find . -type f -name '*.deed' -not -path './.git/*' -print0 | sort -z)
          count="${#files[@]}"
          echo "Found $count .deed file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No .deed files found in repository"
            exit 1
          fi

          node "$LINTER" "${files[@]}"
          {
            echo "## DEED Conformance (ABNF v1.2.0)"
            echo ""
            echo ":white_check_mark: Validated **$count** \`.deed\` file(s) with \`1-formats/deed/tools/deed_lint.js\` (0 retired \`.a2ml\` files)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2: K9 conformance — canonical k9-validate.sh (L0-L2) + k9-grid.sh
  # ---------------------------------------------------------------------------
  k9-validate:
    name: Validate K9 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CANON_REF: 01c9b0c9f2646ebea0b30a9588462642ac94aee9
      NICKEL_VERSION: '1.18.0'
      NICKEL_SHA256: 9cba4dd65ae9915ec61f73033aafcff307a377665a83fd8f530df086763318cb
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out canonical K9 validator and grid renderer from standards
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: 01c9b0c9f2646ebea0b30a9588462642ac94aee9
          path: .k9-canon
          persist-credentials: false
          sparse-checkout: |
            1-formats/k9
            scripts/k9-grid.sh
            scripts/lib/k9-grid.jq
          sparse-checkout-cone-mode: false

      - name: Install Nickel (pinned, sha256-verified)
        run: |
          set -euo pipefail
          URL="https://github.com/tweag/nickel/releases/download/${NICKEL_VERSION}/nickel-x86_64-linux"
          curl -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 -o "$RUNNER_TEMP/nickel" "$URL"
          echo "${NICKEL_SHA256}  ${RUNNER_TEMP}/nickel" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/nickel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validator self-test
        run: |
          set +e
          bash .k9-canon/1-formats/k9/tools/k9-validate.sh --self-test > "$RUNNER_TEMP/selftest.log" 2>&1
          echo "SELFTEST_CODE=$?" >> "$GITHUB_ENV"
          tail -n 5 "$RUNNER_TEMP/selftest.log"

      - name: Contract typecheck
        run: |
          set +e
          nickel typecheck .k9-canon/1-formats/k9/spec/contract/k9_contract.ncl > "$RUNNER_TEMP/typecheck.log" 2>&1
          echo "TYPECHECK_CODE=$?" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/typecheck.log"

      - name: Enumerate committed K9 files and Validate (L0-L2, strict)
        run: |
          set -euo pipefail
          git ls-files -z -- '*.k9.ncl' '*.k9' \
            | tr '\0' '\n' \
            | { grep -v -E '^(\.k9-canon/|9-archive/|1-formats/k9/tools/fixtures/)' || [ $? -eq 1 ]; } \
            | sort > "$RUNNER_TEMP/expected"
          echo "$(wc -l < "$RUNNER_TEMP/expected") committed K9 file(s)"
          : > "$RUNNER_TEMP/changed"
          : > "$RUNNER_TEMP/results.jsonl"
          set +e
          worst=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            bash .k9-canon/1-formats/k9/tools/k9-validate.sh --strict --layer L2 --json --quiet -- "$f" >> "$RUNNER_TEMP/results.jsonl" 2>> "$RUNNER_TEMP/corpus.log"
            rc=$?
            [ "$rc" -gt "$worst" ] && worst=$rc
          done < "$RUNNER_TEMP/expected"
          set -e
          echo "CORPUS_CODE=$worst" >> "$GITHUB_ENV"
          echo "validator worst exit status: $worst"

      - name: Read previous K9 verdict grid on pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- verdict-grid:k9 ")))]
                     | last | .body // ""' \
            > "$RUNNER_TEMP/previous.md" || : > "$RUNNER_TEMP/previous.md"

      - name: Render the K9 verdict grid
        id: grid
        if: ${{ always() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 'local' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/k9-grid" --results "$RUNNER_TEMP/results.jsonl" --expected "$RUNNER_TEMP/expected"
                --changed "$RUNNER_TEMP/changed" --selftest "$RUNNER_TEMP/selftest.log" --selftest-code "$SELFTEST_CODE"
                --typecheck "$RUNNER_TEMP/typecheck.log" --typecheck-code "$TYPECHECK_CODE" --corpus-code "$CORPUS_CODE"
                --sha "$HEAD_SHA" --run "$GITHUB_RUN_ID" --url "$RUN_URL" --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
                --canon-ref "$CANON_REF" --require-files)
          [ -s "$RUNNER_TEMP/previous.md" ] && args+=(--previous "$RUNNER_TEMP/previous.md")
          bash .k9-canon/scripts/k9-grid.sh render "${args[@]}"
          cp "$RUNNER_TEMP/selftest.log" "$RUNNER_TEMP/typecheck.log" "$RUNNER_TEMP/results.jsonl" "$RUNNER_TEMP/k9-grid/"
          [ -f "$RUNNER_TEMP/corpus.log" ] && cp "$RUNNER_TEMP/corpus.log" "$RUNNER_TEMP/k9-grid/"
          rm -rf .k9-canon

      - name: Upload K9 verdict grid artifact
        if: ${{ always() && steps.grid.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid
          if-no-files-found: error
          retention-days: 90

      - name: Gate on K9 verdict
        env:
          STATE: ${{ steps.grid.outputs.state }}
        run: |
          set -euo pipefail
          echo "K9 verdict grid: $STATE"
          if [ "$STATE" = "red" ]; then
            echo "::error::K9 conformance failed; see the k9-grid artifact and the step summary"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Post/update the K9 verdict grid on the pull request
  # ---------------------------------------------------------------------------
  k9-verdict:
    name: Post the K9 verdict grid
    needs: k9-validate
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.k9-validate.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the grid
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: k9-grid
          path: ${{ runner.temp }}/k9-grid

      - name: Create or update the grid comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GRID: ${{ runner.temp }}/k9-grid/report.md
          MARKER: '<!-- verdict-grid:k9 regenerated on every run -->'
        run: |
          set -euo pipefail
          if [ ! -s "$GRID" ]; then
            echo "::warning::the k9-grid artifact holds no report.md; the lane did not render a grid, see its job"
            exit 0
          fi
          comment_id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq -r --arg m "$MARKER" \
                '[.[][] | select(.user.login == "github-actions[bot]" and (.body | contains($m)))] | last | .id // ""')"
          jq -n --rawfile body "$GRID" '{body: $body}' > "$RUNNER_TEMP/k9-comment.json"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/k9-comment.json" >/dev/null
          fi

  # ---------------------------------------------------------------------------
  # Job 4: Empty-linter — invisible character detection
  # ---------------------------------------------------------------------------
  empty-lint:
    name: Empty-linter (invisible characters)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan for invisible C0/NUL characters
        run: |
          set -euo pipefail
          PATTERNS='\x00|[\x01-\x08\x0B\x0C\x0E-\x1F]'
          set +e
          find "$GITHUB_WORKSPACE" \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/target/*' -not -path '*/zig-out/*' \
            -type f \( -name '*.rs' -o -name '*.zig' -o -name '*.idr' -o -name '*.eph' \
              -o -name '*.deed' -o -name '*.k9' -o -name '*.ncl' -o -name '*.json' \
              -o -name '*.toml' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' \
              -o -name '*.adoc' -o -name '*.sh' \) \
            -exec LC_ALL=C.UTF-8 grep -aPl "$PATTERNS" {} + > /tmp/empty-lint-blocking.txt
          set -e
          blocking=$(wc -l < /tmp/empty-lint-blocking.txt 2>/dev/null || echo 0)
          if [ "${blocking:-0}" -gt 0 ]; then
            echo "::error::$blocking file(s) contain C0 control characters or NUL bytes"
            cat /tmp/empty-lint-blocking.txt
            exit 1
          fi
          echo "No C0/NUL corruption detected."
